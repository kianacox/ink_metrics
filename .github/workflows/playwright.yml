name: Playwright E2E

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pinned Supabase CLI version. Bump intentionally to pull a new CLI + Docker
# image set; the Docker image cache key is derived from this so cached images
# survive across runs unless this version is updated.
env:
  SUPABASE_CLI_VERSION: 2.98.2
  TOTAL_SHARDS: 3

jobs:
  playwright-shard:
    name: Playwright shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # First run (no Docker cache) pulls ~1-2 GB of images; subsequent cached
    # runs are much faster. 30 min covers cold-cache shards safely.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------------
      # Playwright — resolve version from lockfile so the cache key is exact
      # ---------------------------------------------------------------------------

      - name: Get Playwright version
        id: playwright-version
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const lock = require("./package-lock.json");
          const version = lock.packages?.["node_modules/@playwright/test"]?.version;

          if (!version) {
            throw new Error("Could not determine @playwright/test version from package-lock.json");
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          EOF

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------------
      # Supabase CLI — pinned to a specific version so the Docker image cache
      # is stable across runs. Update SUPABASE_CLI_VERSION above to bump.
      # ---------------------------------------------------------------------------

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Cache Supabase Docker images
        id: supabase-docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-docker-cache
          key: ${{ runner.os }}-supabase-docker-${{ env.SUPABASE_CLI_VERSION }}

      - name: Load cached Supabase Docker images
        if: steps.supabase-docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "Loading Supabase Docker images from cache..."
          docker load -i /tmp/supabase-docker-cache/images.tar.gz
          echo "Images loaded."

      # Snapshot the image list before supabase start so we can diff afterwards
      # and only cache the images Supabase actually pulled.
      - name: Record pre-existing Docker images
        if: steps.supabase-docker-cache.outputs.cache-hit != 'true'
        run: |
          docker images --format "{{.Repository}}:{{.Tag}}" | sort > /tmp/pre-supabase-images.txt
          echo "Pre-existing images: $(wc -l < /tmp/pre-supabase-images.txt)"

      # ---------------------------------------------------------------------------
      # Parallel startup: Supabase boots in the background while the production
      # build runs in the foreground. Both must finish before tests start.
      # ---------------------------------------------------------------------------

      - name: Start Supabase stack in background
        run: |
          {
            attempts=0
            max_attempts=3
            until [ "$attempts" -ge "$max_attempts" ]; do
              attempts=$((attempts + 1))
              echo "Starting Supabase (attempt ${attempts}/${max_attempts})..."
              if supabase start; then
                echo "Supabase started successfully."
                touch /tmp/supabase-ready
                exit 0
              fi
              if [ "$attempts" -lt "$max_attempts" ]; then
                echo "Start failed. Stopping containers and retrying in 15 s..."
                supabase stop --no-backup 2>/dev/null || true
                sleep 15
              fi
            done
            echo "Supabase failed to start after ${max_attempts} attempts."
            touch /tmp/supabase-failed
            exit 1
          } > /tmp/supabase-start.log 2>&1 &
          echo "supabase_pid=$!" >> "$GITHUB_ENV"
          echo "Supabase boot started in background (pid $!)."

      - name: Build Next.js production bundle
        run: npm run build

      - name: Wait for Supabase to be ready
        run: |
          echo "Waiting for background Supabase start to finish..."
          # Wait for either ready or failed sentinel (or process exit).
          while kill -0 "$supabase_pid" 2>/dev/null; do
            if [ -f /tmp/supabase-failed ]; then
              echo "Supabase reported failure during background start."
              cat /tmp/supabase-start.log || true
              exit 1
            fi
            sleep 2
          done

          if [ -f /tmp/supabase-ready ]; then
            echo "Supabase is ready."
            cat /tmp/supabase-start.log || true
            exit 0
          fi

          echo "Supabase background process exited without a ready signal."
          cat /tmp/supabase-start.log || true
          exit 1

      # Diff against the pre-start snapshot so we only save images Supabase pulled.
      - name: Save Supabase Docker images
        if: steps.supabase-docker-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/supabase-docker-cache
          docker images --format "{{.Repository}}:{{.Tag}}" | sort > /tmp/post-supabase-images.txt
          NEW_IMAGES=$(comm -13 /tmp/pre-supabase-images.txt /tmp/post-supabase-images.txt \
            | grep -v "^<none>" \
            | tr '\n' ' ')
          if [ -n "$NEW_IMAGES" ]; then
            echo "Saving Supabase images: $NEW_IMAGES"
            # shellcheck disable=SC2086
            docker save $NEW_IMAGES | gzip -c > /tmp/supabase-docker-cache/images.tar.gz
            echo "Cache size: $(du -sh /tmp/supabase-docker-cache/images.tar.gz | cut -f1)"
          else
            echo "No new images to cache."
          fi

      # ---------------------------------------------------------------------------
      # Environment — export Supabase URLs and write the app .env.local
      # ---------------------------------------------------------------------------

      - name: Export local Supabase env vars
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Create local test env file
        env:
          E2E_SIGN_UP_PASSWORD_SECRET: ${{ secrets.E2E_SIGN_UP_PASSWORD }}
          E2E_SEEDED_USER_PASSWORD_SECRET: ${{ secrets.E2E_SEEDED_USER_PASSWORD }}
        run: |
          TEST_PASSWORD="$E2E_SIGN_UP_PASSWORD_SECRET"
          if [ -z "$TEST_PASSWORD" ]; then
            TEST_PASSWORD="$(node -e "console.log('Tt' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36) + '!9')")"
          fi
          SEEDED_PASSWORD="$E2E_SEEDED_USER_PASSWORD_SECRET"
          if [ -z "$SEEDED_PASSWORD" ]; then
            # Matches deterministic seeded auth users from supabase/seed.sql.
            SEEDED_PASSWORD="Password123!"
          fi
          cat <<EOF > .env.local
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001
          INBUCKET_BASE_URL=http://127.0.0.1:54324
          E2E_SIGN_UP_PASSWORD=$TEST_PASSWORD
          E2E_SEEDED_USER_PASSWORD=$SEEDED_PASSWORD
          E2E_MAILBOX_DOMAIN=example.com
          EOF

      # ---------------------------------------------------------------------------
      # Database — apply migrations and seed with retries
      # ---------------------------------------------------------------------------

      - name: Reset local database
        run: |
          attempts=0
          max_attempts=3
          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts + 1))
            echo "Running Supabase DB reset (attempt ${attempts}/${max_attempts})..."
            if supabase db reset --local --yes; then
              echo "Supabase DB reset succeeded."
              exit 0
            fi

            if [ "$attempts" -lt "$max_attempts" ]; then
              # Full stack restart before retrying — ensures the storage service
              # (and all other containers) are healthy before db reset runs again.
              echo "Supabase DB reset failed. Restarting stack before retry..."
              supabase stop --no-backup 2>/dev/null || true
              sleep 10
              supabase start
            fi
          done

          echo "Supabase DB reset failed after ${max_attempts} attempts. Capturing debug output..."
          supabase db reset --local --yes --debug
          exit 1

      # ---------------------------------------------------------------------------
      # Tests — sharded slice of the Playwright suite, blob reporter so the
      # merge job can produce one combined HTML report.
      # ---------------------------------------------------------------------------

      - name: Run Playwright shard
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }} --reporter=blob
        env:
          PLAYWRIGHT_SKIP_DB_RESET: "1"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  merge-report:
    name: Merge Playwright reports
    if: always()
    needs: playwright-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from all shards
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
