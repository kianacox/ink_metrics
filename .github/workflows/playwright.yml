name: Playwright E2E

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pin the Supabase CLI to a known-good version. Update this intentionally
# rather than riding `latest`, which can introduce breaking behaviour.
env:
  SUPABASE_CLI_VERSION: "2.23.4"

jobs:
  playwright-e2e:
    name: Run full Playwright suite with local Supabase
    runs-on: ubuntu-latest
    # First run (no Docker cache) pulls ~1-2 GB of images and can take ~20 min;
    # subsequent cached runs complete in ~10 min. 45 min covers both safely.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------------
      # Playwright — resolve version from lockfile so the cache key is exact
      # ---------------------------------------------------------------------------

      - name: Get Playwright version
        id: playwright-version
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const lock = require("./package-lock.json");
          const version = lock.packages?.["node_modules/@playwright/test"]?.version;

          if (!version) {
            throw new Error("Could not determine @playwright/test version from package-lock.json");
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          EOF

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Install browser early so it overlaps with the Supabase setup below
      - name: Install Playwright browser and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------------
      # Supabase — cache Docker images so `supabase start` skips the multi-GB pull
      # on every run. Cache key is keyed on the CLI version so a version bump
      # automatically busts it.
      # ---------------------------------------------------------------------------

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Cache Supabase Docker images
        id: supabase-docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-docker-cache
          key: ${{ runner.os }}-supabase-docker-${{ env.SUPABASE_CLI_VERSION }}

      - name: Load cached Supabase Docker images
        if: steps.supabase-docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "Loading Supabase Docker images from cache..."
          docker load -i /tmp/supabase-docker-cache/images.tar
          echo "Images loaded."

      # supabase start has its own internal health check; we just need retries for
      # transient Docker failures. No separate health-check loop required.
      - name: Start local Supabase stack
        run: |
          attempts=0
          max_attempts=3
          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts + 1))
            echo "Starting Supabase (attempt ${attempts}/${max_attempts})..."
            if supabase start; then
              echo "Supabase started successfully."
              exit 0
            fi
            if [ "$attempts" -lt "$max_attempts" ]; then
              echo "Start failed. Stopping containers and retrying in 15 s..."
              supabase stop --no-backup 2>/dev/null || true
              sleep 15
            fi
          done
          echo "Supabase failed to start after ${max_attempts} attempts."
          exit 1

      # Persist images to cache after a successful first-time start
      - name: Save Supabase Docker images
        if: steps.supabase-docker-cache.outputs.cache-hit != 'true'
        run: |
          echo "Saving Supabase Docker images to cache..."
          mkdir -p /tmp/supabase-docker-cache
          # Collect every image that is now present on the runner (the runner
          # starts clean, so everything here was pulled by supabase start).
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep -v "^<none>" \
            | sort -u \
            | tr '\n' ' ')
          if [ -n "$IMAGES" ]; then
            # shellcheck disable=SC2086
            docker save $IMAGES -o /tmp/supabase-docker-cache/images.tar
            echo "Saved images: $IMAGES"
          else
            echo "No images found to cache."
          fi

      # ---------------------------------------------------------------------------
      # Environment — export Supabase URLs and write the app .env.local
      # ---------------------------------------------------------------------------

      - name: Export local Supabase env vars
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Create local test env file
        run: |
          cat <<EOF > .env.local
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001
          INBUCKET_BASE_URL=http://127.0.0.1:54324
          E2E_SIGN_UP_PASSWORD=Password123!
          E2E_MAILBOX_DOMAIN=example.com
          EOF

      # ---------------------------------------------------------------------------
      # Database — apply migrations and seed with retries
      # ---------------------------------------------------------------------------

      - name: Reset local database
        run: |
          attempts=0
          max_attempts=3
          until [ "$attempts" -ge "$max_attempts" ]; do
            attempts=$((attempts + 1))
            echo "Running Supabase DB reset (attempt ${attempts}/${max_attempts})..."
            if supabase db reset --local --yes; then
              echo "Supabase DB reset succeeded."
              exit 0
            fi

            if [ "$attempts" -lt "$max_attempts" ]; then
              echo "Supabase DB reset failed. Retrying after brief wait..."
              sleep 15
            fi
          done

          echo "Supabase DB reset failed after ${max_attempts} attempts. Capturing debug output..."
          supabase db reset --local --yes --debug
          exit 1

      # ---------------------------------------------------------------------------
      # Tests
      # ---------------------------------------------------------------------------

      - name: Run Playwright test suite
        run: npm run test:e2e
        env:
          PLAYWRIGHT_SKIP_DB_RESET: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
