<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f7fef6;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica,
        Arial, sans-serif;
      color: #12303d;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #f7fef6; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 560px;
              background: #ffffff;
              border: 1px solid #cde7c5;
              border-radius: 10px;
            "
          >
            <tr>
              <td style="padding: 28px 24px 12px 24px">
                <p
                  style="
                    margin: 0 0 14px 0;
                    font-size: 14px;
                    font-weight: 700;
                    line-height: 1.3;
                    color: #35c714;
                    letter-spacing: 0.2px;
                  "
                >
                  inkMetrics
                </p>

                <h2
                  style="
                    margin: 0 0 16px 0;
                    font-size: 28px;
                    line-height: 1.2;
                    color: #12303d;
                  "
                >
                  Reset your password
                </h2>

                <p
                  style="
                    margin: 0 0 16px 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #345462;
                  "
                >
                  Follow this link to reset your password:
                </p>

                <p style="margin: 0">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/update-password"
                    style="
                      display: inline-block;
                      background: #35c714;
                      color: #ffffff;
                      text-decoration: none;
                      font-weight: 600;
                      font-size: 16px;
                      line-height: 1;
                      border-radius: 8px;
                      padding: 14px 18px;
                    "
                  >
                    Reset password
                  </a>
                </p>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 14px 24px 24px 24px;
                  font-size: 13px;
                  line-height: 1.5;
                  color: #5a7580;
                "
              >
                If you did not request a password reset, you can safely ignore
                this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
